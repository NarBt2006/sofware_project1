# ============ H2 in-memory database ============
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:librarydb, user: sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============ JPA / Hibernate ============
# Schema is created from the entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serialize java.time dates as ISO-8601 (yyyy-MM-dd)
spring.jackson.serialization.write-dates-as-timestamps=false

# ============ Library business rules ============
# Allowed loan period in days; a loan becomes overdue after this many days
library.loan.period-days=14
# Fixed daily fine for every overdue day, in Toman
library.fine.daily-amount=5000
