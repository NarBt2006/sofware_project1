# ============ SQLite profile (file-based, persistent) ============
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=sqlite
#          or:    java -jar target/library-management-system-1.0.0.jar --spring.profiles.active=sqlite
#
# The database file library.db is created in the working directory on first
# start (with seed data) and KEPT across restarts. Delete the file to reset.

spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Hibernate community dialect for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Tables are created on first start and reused afterwards
spring.jpa.hibernate.ddl-auto=update

# The H2 web console does not work with SQLite; use "DB Browser for SQLite"
# or the sqlite3 CLI to inspect library.db instead
spring.h2.console.enabled=false
